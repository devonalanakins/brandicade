name: Verify source-exact Brandicade preview preflight
on:
  pull_request:
    paths:
      - 'scripts/prepare_current_preview.py'
      - 'tests/test_prepare_current_preview.py'
      - 'scripts/prepare_frontend_only_cutover.py'
      - 'scripts/save_contract_parity.py'
      - 'scripts/verify_release_assets.py'
      - 'build_worker.py'
      - 'sw.js'
      - 'src/cloud-sync.mjs'
      - '.github/workflows/verify-source-exact-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_preview_preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline source-precise preflight and safety negatives
        run: |
          python3 -m unittest discover -s tests -p 'test_prepare_current_preview.py' -v
          python3 -m py_compile scripts/prepare_current_preview.py
      - name: Generate and verify current static source assets
        run: |
          python3 build_worker.py
          python3 scripts/verify_release_assets.py --output dist/brandicade-release-assets.json
      - name: Verify v9 cloud bridge translation against real current assets
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_current_preview import build_preview_asset_table
          from build_worker import ASSETS
          raw, proof = build_preview_asset_table(Path("dist/brandicade.worker.js").read_bytes())
          entries = json.loads(raw)
          assert set(entries) == set(ASSETS) | {"/src/cloud-sync.mjs"}
          sw = entries["/sw.js"]
          blob = base64.b64decode(sw["b"], validate=True)
          if sw["g"]:
              blob = gzip.decompress(blob)
          assert b"const CACHE='brandicade-glimmer-cascade-cloud-bridge-v9'" in blob
          assert b"const ASSETS=['/src/cloud-sync.mjs'," in blob
          assert proof["route_count"] == len(ASSETS)
          print("Verified source-exact staged assets; NO deployment performed")
          PY
# Deliberately no Cloudflare credentials, live Worker readbacks or deploy step.
